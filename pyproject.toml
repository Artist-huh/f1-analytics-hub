[project]
name = "f1-analytics-hub"
version = "2.2.0"
description = "F1 Analytics Hub — статистика чемпионата Формулы-1: пилоты, команды, календарь, сравнение"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flet>=1.0.5,<2",
    "requests>=2.34.2",
]

[tool.flet]
org = "com.f1hub"
product = "F1 Analytics Hub"
company = "F1 Hub"
copyright = "MIT License"

[tool.flet.app]
path = "."
exclude = ["venv", "tests", "build", "dist", "docs", ".github", "*.bat", "*.md"]

[tool.flet.android]
# Тёмный фон под адаптивную иконку и сплэш — в цвет приложения
adaptive_icon_background = "#15151E"
# Уведомления на Android: отправка — NotificationManager через pyjnius (есть в репозитории пакетов Flet),
# запрос разрешения POST_NOTIFICATIONS — официальное расширение Flet (версия = версии Flet).
# Радио команд — проигрывание через flet-audio; расшифровки и перевода на Android нет (тяжёлые модели).
dependencies = ["pyjnius", "flet-permission-handler==1.0.5", "flet-audio==1.0.5"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.POST_NOTIFICATIONS" = true

[tool.flet.splash]
color = "#15151E"
dark_color = "#15151E"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", "build", "dist"]

[tool.ruff.lint]
# pyflakes, pycodestyle, порядок импортов, частые ошибки (bugbear), упрощения
select = ["E", "W", "F", "I", "B", "SIM", "UP", "RUF100"]
ignore = [
    "F403", "F405",   # from design_system import * — намеренно: токены дизайна во всех экранах
    "E731",           # короткие lambda для отложенной загрузки (fetch = lambda: ...)
    "SIM108",         # тернарник не всегда читабельнее if/else
    "UP007", "UP045", # Optional[...] в старом коде — не трогаем ради истории
]

[tool.ruff.lint.isort]
known-first-party = ["services", "ui", "design_system", "main", "tests", "tools"]
