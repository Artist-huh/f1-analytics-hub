name: Источники данных

# Раз в день: отвечают ли бесплатные источники (Jolpica, поток F1 live timing, OpenF1, MultiViewer)
# и не сменили ли формат. Упавший прогон по расписанию GitHub присылает владельцу письмом —
# так о закрытии источника мы узнаём раньше пользователей.
on:
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC каждый день (не ровно в час — меньше очередь в GitHub)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Зависимости (только сетевые клиенты)
      run: pip install requests websockets -c constraints.txt

    - name: Проверка источников
      run: python tools/check_sources.py
