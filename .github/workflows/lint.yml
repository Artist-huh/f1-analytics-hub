name: Lint and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    # Правила — в pyproject.toml ([tool.ruff]); версия закреплена, чтобы новые правила не ломали CI внезапно
    - name: Ruff
      run: |
        pip install ruff==0.17.2
        ruff check --output-format=github .

    - name: Unit tests
      env:
        F1_HUB_LOG: "off"
      run: |
        pip install -r requirements.txt -c constraints.txt
        python -m unittest discover -s tests -t .

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    # Известные уязвимости в закреплённых версиях библиотек (база PyPI / OSV) — бесплатно, без ключей
    - name: pip-audit
      run: |
        pip install pip-audit==2.10.1
        pip-audit -r constraints.txt --no-deps --disable-pip --progress-spinner off

    # Опасные приёмы в нашем коде (SQL из строк, eval, subprocess с shell=True…): средний уровень и выше
    - name: bandit
      run: |
        pip install bandit==1.9.4
        bandit -q -r services ui main.py design_system.py -ll
