name: Build (Windows, macOS, Android, iOS)

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write   # gh release upload

env:
  # имя тега — только через переменную окружения, не подстановкой в текст команды (инъекция в run:)
  TAG: ${{ github.event.release.tag_name }}
  # Python печатает по-русски: без этого на Windows вывод в cp1252 падает с UnicodeEncodeError
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: "Test and build (build.bat: tests -> data snapshot -> flet pack)"
      shell: cmd
      run: build.bat

    - name: List build output
      run: |
        dir dist

    - name: Radio models for the launch check (whisper.cpp base.en, Argos en-ru)
      run: python tools/fetch_radio_models.py base.en-q5_1

    - name: Launch check (exe starts, runs 60 s, log without errors, radio transcribed)
      run: python tools/desktop_smoke.py dist\F1AnalyticsHub.exe --radio

    - name: Create release package
      run: |
        mkdir release
        copy dist\F1AnalyticsHub.exe release\
        copy README.md release\
        copy QUICKSTART.md release\

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: F1AnalyticsHub-Windows
        path: release/

    - name: Create ZIP archive
      if: github.event_name == 'release'
      run: |
        Compress-Archive -Path release\* -DestinationPath "F1AnalyticsHub-$env:TAG-Windows.zip"

    - name: Upload release asset
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "$env:TAG" "F1AnalyticsHub-$env:TAG-Windows.zip" --clobber

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -c constraints.txt
        pip install pyinstaller -c constraints.txt

    - name: Run tests
      env:
        F1_HUB_LOG: "off"
      run: python -m unittest discover -s tests -t .

    - name: Build with flet pack
      run: |
        pip install pillow   # PyInstaller converts icon.png to .icns with it
        VER=$(python -c "from services.version import VERSION; print(VERSION)")   # номер — из pyproject.toml
        flet pack main.py -y --name F1AnalyticsHub --icon assets/icon.png --add-data "assets:assets" "data:data" "pyproject.toml:." --product-name "F1 Analytics Hub" --product-version "$VER" --bundle-id com.f1hub.analytics --pyinstaller-build-args=--collect-all=desktop_notifier --pyinstaller-build-args=--collect-all=pywhispercpp --pyinstaller-build-args=--hidden-import=_pywhispercpp --pyinstaller-build-args=--exclude-module=pywhispercpp.examples --pyinstaller-build-args=--hidden-import=miniaudio --pyinstaller-build-args=--hidden-import=_miniaudio --pyinstaller-build-args=--hidden-import=_cffi_backend --pyinstaller-build-args=--hidden-import=ctranslate2 --pyinstaller-build-args=--hidden-import=sentencepiece --pyinstaller-build-args=--hidden-import=pywhispercpp.model --pyinstaller-build-args=--collect-binaries=ctranslate2

    - name: Radio models for the launch check (whisper.cpp base.en, Argos en-ru)
      run: python tools/fetch_radio_models.py base.en-q5_1

    - name: Launch check (.app starts, runs 60 s, log without errors, radio transcribed)
      run: python tools/desktop_smoke.py dist/F1AnalyticsHub.app/Contents/MacOS/F1AnalyticsHub --radio

    - name: Create release package
      run: |
        mkdir -p release
        ditto -c -k --keepParent dist/F1AnalyticsHub.app release/F1AnalyticsHub-macOS.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: F1AnalyticsHub-macOS
        path: release/

    - name: Upload release asset
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mv release/F1AnalyticsHub-macOS.zip "F1AnalyticsHub-$TAG-macOS.zip"
        gh release upload "$TAG" "F1AnalyticsHub-$TAG-macOS.zip" --clobber

  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache Flutter SDK
      uses: actions/cache@v6
      with:
        path: ~/flutter
        key: flutter-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -c constraints.txt

    - name: Run tests
      env:
        F1_HUB_LOG: "off"
      run: python -m unittest discover -s tests -t .

    # whisper_cpp_flutter_plus (расшифровка радио) собирает whisper.cpp только под ARM, а эмулятор в test-android —
    # x86_64. Скрипт инициализации Gradle добавляет плагину x86_64, чтобы самопроверку радио можно было пройти
    # на эмуляторе (на телефонах ARM ничего не меняется).
    - name: whisper.cpp for the x86_64 emulator (Gradle init script)
      run: |
        mkdir -p ~/.gradle/init.d
        cat > ~/.gradle/init.d/whisper-x86_64.gradle <<'EOF'
        gradle.beforeProject { p ->
          if (p.name == 'whisper_cpp_flutter_plus') {
            p.pluginManager.withPlugin('com.android.library') {
              p.android.defaultConfig.ndk.abiFilters.add('x86_64')
            }
          }
        }
        EOF
        cat ~/.gradle/init.d/whisper-x86_64.gradle

    - name: Build APKs per ABI (flet build installs Flutter itself; Android SDK is on the runner)
      run: flet build apk --split-per-abi --yes --no-rich-output --skip-flutter-doctor

    - name: List APKs
      run: ls -la build/apk

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: F1AnalyticsHub-Android
        path: build/apk/*.apk

    - name: Upload release asset
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for f in build/apk/*.apk; do
          abi=$(basename "$f" .apk | sed -E 's/.*-(arm64-v8a|armeabi-v7a|x86_64).*/\1/')
          cp "$f" "F1AnalyticsHub-$TAG-Android-$abi.apk"
        done
        gh release upload "$TAG" F1AnalyticsHub-*-Android-*.apk --clobber

  test-android:
    # Запуск APK на эмуляторе Android 14: главный экран, вкладки, «назад», уведомление, logcat
    needs: build-android
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Download APKs
      uses: actions/download-artifact@v8
      with:
        name: F1AnalyticsHub-Android
        path: apk

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run on emulator
      uses: ReactiveCircus/android-emulator-runner@v2.38.0
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        script: python3 tools/android_smoke.py "$(ls apk/*x86_64*.apk | head -1)" android-shots

    - name: Upload screenshots and logcat
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Android-emulator-check
        path: android-shots/

  build-ios:
    # Неподписанный .ipa: подписать бесплатным Apple ID и поставить на iPhone — Sideloadly или AltStore
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -c constraints.txt

    - name: Build for iOS Simulator (checked by test-ios)
      run: |
        # шаблон Flet вшивает iOS 13.0, а радио (whisper.cpp, ML Kit) требует 15.5: первый запуск создаёт
        # проект и падает на pod install, затем поднимаем версию и собираем снова
        flet build ios-simulator --yes --no-rich-output --skip-flutter-doctor || true
        python tools/ios_deployment_target.py 15.5
        flet build ios-simulator --yes --no-rich-output --skip-flutter-doctor --verbose

    - name: Build unsigned IPA (Xcode archive -> Payload/Runner.app)
      run: |
        flet build ipa --yes --no-rich-output --skip-flutter-doctor || true
        python tools/ios_deployment_target.py 15.5
        flet build ipa --yes --no-rich-output --skip-flutter-doctor
        app=$(find build/ipa build/ios -path "*.xcarchive/Products/Applications/*.app" -maxdepth 6 | head -1)
        echo "app: $app"
        mkdir -p ipa/Payload
        cp -R "$app" ipa/Payload/
        (cd ipa && zip -qry ../F1AnalyticsHub-iOS-unsigned.ipa Payload)

    - name: Upload IPA
      uses: actions/upload-artifact@v7
      with:
        name: F1AnalyticsHub-iOS
        path: F1AnalyticsHub-iOS-unsigned.ipa

    - name: Upload simulator app
      uses: actions/upload-artifact@v7
      with:
        name: F1AnalyticsHub-iOS-Simulator
        path: build/ios-simulator/

    - name: Upload release asset
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mv F1AnalyticsHub-iOS-unsigned.ipa "F1AnalyticsHub-$TAG-iOS-unsigned.ipa"
        gh release upload "$TAG" "F1AnalyticsHub-$TAG-iOS-unsigned.ipa" --clobber

  test-ios:
    # Запуск на симуляторе iPhone: приложение не падает, журнал без ошибок, снимки экрана
    needs: build-ios
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Download simulator app
      uses: actions/download-artifact@v8
      with:
        name: F1AnalyticsHub-iOS-Simulator
        path: sim

    - name: Run on iPhone simulator
      run: python3 tools/ios_smoke.py "$(find sim -name '*.app' -maxdepth 2 | head -1)" ios-shots

    - name: Upload screenshots and log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: iOS-simulator-check
        path: ios-shots/
