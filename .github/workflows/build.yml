name: Build Windows Executable

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write   # gh release upload

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: "Test and build (build.bat: tests -> data snapshot -> flet pack)"
      shell: cmd
      run: build.bat

    - name: List build output
      run: |
        dir dist

    - name: Create release package
      run: |
        mkdir release
        copy dist\F1AnalyticsHub.exe release\
        copy README.md release\
        copy QUICKSTART.md release\

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: F1AnalyticsHub-Windows
        path: release/

    - name: Create ZIP archive
      if: github.event_name == 'release'
      run: |
        Compress-Archive -Path release\* -DestinationPath F1AnalyticsHub-${{ github.event.release.tag_name }}-Windows.zip

    - name: Upload release asset
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.event.release.tag_name }}" "F1AnalyticsHub-${{ github.event.release.tag_name }}-Windows.zip" --clobber

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run tests
      env:
        F1_HUB_LOG: "off"
      run: python -m unittest discover -s tests -t .

    - name: Build with flet pack
      run: |
        pip install pillow   # PyInstaller converts icon.png to .icns with it
        flet pack main.py -y --name F1AnalyticsHub --icon assets/icon.png --add-data "assets:assets" "data:data" --product-name "F1 Analytics Hub" --product-version "2.2.0" --bundle-id com.f1hub.analytics --pyinstaller-build-args=--collect-all=desktop_notifier --pyinstaller-build-args=--collect-all=faster_whisper --pyinstaller-build-args=--collect-binaries=ctranslate2 --pyinstaller-build-args=--exclude-module=onnxruntime

    - name: Create release package
      run: |
        mkdir -p release
        ditto -c -k --keepParent dist/F1AnalyticsHub.app release/F1AnalyticsHub-macOS.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: F1AnalyticsHub-macOS
        path: release/

    - name: Upload release asset
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mv release/F1AnalyticsHub-macOS.zip "F1AnalyticsHub-${{ github.event.release.tag_name }}-macOS.zip"
        gh release upload "${{ github.event.release.tag_name }}" "F1AnalyticsHub-${{ github.event.release.tag_name }}-macOS.zip" --clobber

  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache Flutter SDK
      uses: actions/cache@v6
      with:
        path: ~/flutter
        key: flutter-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        F1_HUB_LOG: "off"
      run: python -m unittest discover -s tests -t .

    - name: Build APKs per ABI (flet build installs Flutter itself; Android SDK is on the runner)
      run: flet build apk --split-per-abi --yes --no-rich-output --skip-flutter-doctor

    - name: List APKs
      run: ls -la build/apk

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: F1AnalyticsHub-Android
        path: build/apk/*.apk

    - name: Upload release asset
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for f in build/apk/*.apk; do
          abi=$(basename "$f" .apk | sed -E 's/.*-(arm64-v8a|armeabi-v7a|x86_64).*/\1/')
          cp "$f" "F1AnalyticsHub-${{ github.event.release.tag_name }}-Android-$abi.apk"
        done
        gh release upload "${{ github.event.release.tag_name }}" F1AnalyticsHub-*-Android-*.apk --clobber

  test-android:
    # Запуск APK на эмуляторе Android 14: главный экран, вкладки, «назад», уведомление, logcat
    needs: build-android
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Download APKs
      uses: actions/download-artifact@v8
      with:
        name: F1AnalyticsHub-Android
        path: apk

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run on emulator
      uses: ReactiveCircus/android-emulator-runner@v2.38.0
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        script: python3 tools/android_smoke.py "$(ls apk/*x86_64*.apk | head -1)" android-shots

    - name: Upload screenshots and logcat
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Android-emulator-check
        path: android-shots/
