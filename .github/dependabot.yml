# Бесплатные автообновления: Dependabot раз в неделю открывает запрос на слияние с новой версией библиотеки,
# на нём запускаются ruff, тесты и проверка безопасности (lint.yml). Сливать — только если всё зелёное.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"          # requirements.txt, constraints.txt, pyproject.toml
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      flet:                 # Flet и его расширения выходят одной версией — обновлять вместе
        patterns: ["flet", "flet-*"]
      pydantic:             # pydantic требует строго свою версию pydantic-core: по отдельности не ставятся
        patterns: ["pydantic", "pydantic-core", "pydantic_core"]
    ignore:
      # flet-cli 1.0.5 требует chardet<6: chardet 7 (запрос #4) не ставится вместе с Flet. Снять, когда
      # Flet разрешит новую версию
      - dependency-name: chardet
        versions: [">=6"]
    commit-message:
      prefix: "Зависимости"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "Сборка"
