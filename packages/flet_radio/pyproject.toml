[project]
name = "flet-radio"
version = "0.1.0"
description = "Радио команд F1 Analytics Hub на телефоне: расшифровка whisper.cpp и перевод ML Kit (расширение Flet)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["flet>=1.0.5,<2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Python-часть (flet_radio) и Flutter-пакет (flutter/flet_radio) — в одном колесе:
# flet build находит flutter/<имя>/pubspec.yaml в site-packages и подключает его к приложению.
[tool.setuptools.packages.find]
where = ["src"]
include = ["flet_radio*", "flutter*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*", "**/*"]
