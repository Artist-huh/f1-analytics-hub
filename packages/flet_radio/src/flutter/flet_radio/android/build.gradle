group = "com.f1hub.flet_radio"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.f1hub.flet_radio"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 24             // как у whisper_cpp_flutter_plus
    }

    // декодер mp3 (src/radio_decode.c + miniaudio) — под все архитектуры, включая x86_64 эмулятора
    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"
        }
    }
}
